<!DOCTYPE html>
<html lang="sr" dir="ltr">

  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("firstcode.instantPrintSettings");
          var theme = raw ? JSON.parse(raw).theme : null;
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title data-i18n="notFoundTitle">FirstCode | Stranica nije pronađena</title>
    <base href="/">

    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicons/favicon-16x16.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicons/favicon.ico">
    <meta name="theme-color" content="#F4F2FF">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700&amp;family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/error.css">
  </head>

  <body>
    <header class="error-bar">
      <a class="error-brand" href="index.html">
        <img src="assets/img/icons/Logo.png" height="35" alt="FirstCode">
      </a>
      <div class="error-tools">
        <button type="button" class="theme-toggle" aria-pressed="false" aria-label="Uključi tamnu temu" title="Uključi tamnu temu">
          <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M21 14.3A9.1 9.1 0 0 1 9.7 3a7.4 7.4 0 1 0 11.3 11.3z"/>
          </svg>
          <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" d="M12 2.8v1.8M12 19.4v1.8M2.8 12h1.8M19.4 12h1.8M5.1 5.1l1.3 1.3M17.6 17.6l1.3 1.3M5.1 18.9l1.3-1.3M17.6 6.4l1.3-1.3"/>
          </svg>
        </button>
        <div id="appLanguage" class="lang-toggle" role="group" data-i18n-aria="language" aria-label="Jezik">
          <button type="button" data-lang="sr" class="is-active" aria-pressed="true">SR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main class="error-main">
      <div class="error-card">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 data-i18n="notFoundHeading">Stranica nije pronađena</h1>
        <p class="error-lead" data-i18n="notFoundLead">Adresa koju tražiš ne postoji ili je premeštena. Vrati se na početnu i nastavi sa nalepnicama.</p>
        <div class="error-actions">
          <a class="error-btn" href="index.html" data-i18n="backHome">Nazad na početnu</a>
        </div>
      </div>
    </main>

    <footer class="error-footer">
      <p>&copy; 2026 FirstCode</p>
      <p data-i18n="footerCredit">Sva prava zadržana.</p>
    </footer>
    <script src="assets/js/i18n.js"></script>
    <script>initLanguageToggle();</script>
  </body>

</html>
